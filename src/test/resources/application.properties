# EventEase Test Configuration (H2 In-Memory Database)
spring.application.name=EventEase-Test

# Datasource Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.eventease=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Security / JWT Configuration (Test values, no production secrets)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://event-ease-frontend-chi.vercel.app}

# RAG & AI Configuration (Disable external calls and startup indexing during tests)
eventease.rag.chunk-size=500
eventease.rag.chunk-overlap=100
eventease.rag.auto-index-on-startup=false
eventease.rag.similarity-threshold=0.40
eventease.rag.max-results=5
eventease.rag.gemini.enabled=false
eventease.rag.gemini.api-key=

# SpringDoc / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=EventEase
info.app.description=Modern Event Management Platform with AI Assistant & RAG
info.app.version=0.0.1-SNAPSHOT

