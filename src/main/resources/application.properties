# EventEase Application Configuration
spring.application.name=EventEase
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventease}
spring.datasource.username=${DB_USERNAME:eventease_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.eventease=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Security / JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://event-ease-frontend-chi.vercel.app}

# RAG Ingestion & Chunking Configuration
eventease.rag.chunk-size=${RAG_CHUNK_SIZE:500}
eventease.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:100}
eventease.rag.auto-index-on-startup=${RAG_AUTO_INDEX_ON_STARTUP:true}
eventease.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.40}
eventease.rag.max-results=${RAG_MAX_RESULTS:5}

# RAG Gemini AI Model Configuration
eventease.rag.gemini.api-key=${GEMINI_API_KEY:}
eventease.rag.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
eventease.rag.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}
eventease.rag.gemini.connect-timeout-seconds=${GEMINI_CONNECT_TIMEOUT_SECONDS:10}
eventease.rag.gemini.temperature=${GEMINI_TEMPERATURE:0.2}
eventease.rag.gemini.enabled=${GEMINI_ENABLED:true}

# SpringDoc / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=EventEase
info.app.description=Modern Event Management Platform with AI Assistant & RAG
info.app.version=0.0.1-SNAPSHOT

# Admin Account Initialization (Defaults to fixed admin credentials if environment variables omitted)
eventease.admin.email=${ADMIN_EMAIL:admin@eventease.io}
eventease.admin.password=${ADMIN_PASSWORD:Admin@12345}
eventease.admin.name=${ADMIN_NAME:Platform Administrator}

# Cloudinary Persistent Image Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

