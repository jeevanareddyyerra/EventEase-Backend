# ==============================================================================
# EventEase Backend - Standalone Local Development Docker Compose
# ==============================================================================
# Provides a containerized MySQL 8.0 instance for local backend development.
#
# Quickstart:
#   1. Copy .env.example to .env and configure your local credentials:
#        cp .env.example .env
#   2. Start the MySQL database:
#        docker compose -f compose.dev.yaml up -d
#   3. Run the Spring Boot application:
#        mvn spring-boot:run
# ==============================================================================

name: eventease-backend-dev

services:
  db:
    image: mysql:8.0
    container_name: eventease-backend-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-eventease}
      MYSQL_USER: ${DB_USERNAME:-eventease_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-your_mysql_password_here}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-your_root_password_here}
    volumes:
      - eventease-backend-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventease-backend-mysql-data:
    driver: local
